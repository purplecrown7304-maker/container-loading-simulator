<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unity 적재 공간</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#edf3f9}canvas{width:100%;height:100%;display:block;outline:none;touch-action:none}#error{font:14px sans-serif;padding:20px;color:#a22}</style><canvas id="canvas" tabindex="0" aria-label="Unity 3D 적재 공간"></canvas><div id="error" hidden></div><script>
let instance, runtimeReady=false, announced=false;
const report=payload=>parent.postMessage({source:'cargo-unity-host',payload},location.origin);
function ready(){if(instance&&runtimeReady&&!announced){announced=true;report({type:'ready'});}}
addEventListener('message',event=>{
 if(event.origin!==location.origin)return;
 if(event.source===window&&event.data?.source==='cargo-unity')return;
 if(event.source===parent&&event.data?.source==='cargo-web'&&instance){
  if(event.data.type==='plan')instance.SendMessage('CargoViewer','SetPlan',JSON.stringify(event.data.payload));
  if(event.data.type==='command')instance.SendMessage('CargoViewer','Command',JSON.stringify(event.data.payload));
 }
});
// Unity's jslib calls this frame so the loader can finish before parent sends a plan.
window.cargoUnityEvent=payload=>{if(payload.type==='ready'){runtimeReady=true;ready();}else report(payload);};
function fail(error){document.getElementById('error').hidden=false;document.getElementById('error').textContent='Unity 실행 실패: '+String(error);report({type:'error',message:String(error)});}
fetch('./build-config.json').then(r=>{if(!r.ok)throw Error('Unity 빌드 파일을 찾을 수 없습니다.');return r.json();}).then(config=>{
 const script=document.createElement('script');script.src=config.loaderUrl;script.onerror=()=>fail('Unity loader download failed');script.onload=()=>{
 createUnityInstance(document.getElementById('canvas'),{...config,matchWebGLToCanvasSize:true,devicePixelRatio:Math.min(devicePixelRatio,1.5),showBanner:(message,type)=>{if(type==='error')fail(message);}},progress=>report({type:'progress',value:progress})).then(value=>{instance=value;ready();}).catch(fail);
 };document.body.appendChild(script);
}).catch(fail);
document.getElementById('canvas').addEventListener('contextmenu',e=>e.preventDefault());
</script></html>
