name: Claude

# Claude 호출 경로 두 가지
# 1) 이슈/PR 코멘트에 "@claude"라고 쓰면 해당 지시를 수행
# 2) impl:gpt 라벨이 붙은 PR이 열리거나 갱신되면 Claude가 자동 검수
#
# 사전 준비: 레포 Settings → Secrets → Actions 에 ANTHROPIC_API_KEY 등록,
# 그리고 Claude GitHub App 설치 (https://github.com/apps/claude).
# 액션 입력값은 버전에 따라 바뀔 수 있으니 anthropics/claude-code-action README를 확인하세요.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned, labeled]
  pull_request:
    types: [opened, synchronize, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  mention:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'impl:claude')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

  auto-review:
    if: |
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'impl:gpt')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            너는 이 PR의 검수자다. 구현자는 GPT(Codex)다.
            CLAUDE.md, AGENTS.md, docs/agents/COLLABORATION.md 5절을 기준으로 이 PR을 리뷰하라.
            직접 코드를 수정하지 말고, 파일·줄 단위 코멘트와 심각도(차단/권장/사소)로 의견을 남겨라.
            리뷰 마지막 줄에 "판정: 승인" / "판정: 수정 요청" / "판정: 대표 판단 필요" 중 하나를 써라.
