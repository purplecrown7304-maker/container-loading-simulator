name: Runtime Consistency Patch

on:
  push:
    branches: [fix/runtime-consistency-20260908]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/runtime-consistency-20260908
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install -g npm@11
      - run: npm install
      - name: Apply consistency patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'pattern not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          replace(
              'src/engine/palletAdaptiveSearch.ts',
              "const packed = restoreRotationFlags(centerPalletCargo(packOnPallets(current.container, cargo, spec)), variant.forcedRotatedIds);",
              "const packed = restoreRotationFlags(centerPalletCargo(packOnPallets(current.container, cargo, spec), current.container), variant.forcedRotatedIds);",
          )

          p = Path('src/ExcelExportActions.tsx')
          text = p.read_text()
          anchor = "type CurrentTarget = NonNullable<ReturnType<typeof readPhysicsTarget>>;\n"
          alias = """type CurrentTarget = NonNullable<ReturnType<typeof readPhysicsTarget>>;\n\ntype InertiaHistoryRow = {\n  순서: number;\n  단계: string;\n  시나리오: string;\n  전체수평이동_mm: string | number;\n  화물팔레트미끄럼_mm: string | number;\n  팔레트상대이동_mm: string | number;\n  기울기_deg: string | number;\n  판정: string;\n};\n"""
          if anchor not in text:
              raise SystemExit('ExcelExportActions type anchor not found')
          text = text.replace(anchor, alias, 1)
          old_flatmap = "const rows = (certification.attempts ?? []).flatMap((attempt, attemptIndex) => {"
          new_flatmap = "const rows = (certification.attempts ?? []).flatMap<InertiaHistoryRow>((attempt, attemptIndex) => {"
          if old_flatmap not in text:
              raise SystemExit('ExcelExportActions flatMap anchor not found')
          p.write_text(text.replace(old_flatmap, new_flatmap, 1))

          replace(
              'src/App.tsx',
              "&& Number.isInteger(draft.quantity) && draft.quantity >= 1",
              "&& Number.isInteger(draft.quantity) && draft.quantity >= 0",
          )
          replace(
              'src/App.tsx',
              "수량은 1 이상의 정수이고 상부 허용중량은 0 이상이어야 합니다.",
              "수량은 0 이상의 정수이고 상부 허용중량은 0 이상이어야 합니다.",
          )
          replace(
              'src/App.tsx',
              '<label>수량<input type="number" min="1" step="1" value={draft.quantity}',
              '<label>수량<input type="number" min="0" step="1" value={draft.quantity}',
          )

          p = Path('src/HeaderActionBridge.tsx')
          text = p.read_text()
          text = text.replace(
              "import {\n  FINAL_PHYSICS_VALIDATION_COMPLETE_EVENT,\n  readFinalPhysicsValidation,\n} from './autoCertification';",
              "import { FINAL_PHYSICS_VALIDATION_COMPLETE_EVENT } from './autoCertification';",
              1,
          )
          text = text.replace(
              "import {\n  INERTIA_CERTIFICATION_EVENT,\n  createPhysicsTargetSignature,\n  readLatestInertiaCertification,\n} from './inertiaCertification';\nimport { canCreateWorkOrder } from './inertiaWorkOrderPolicy';",
              "import { INERTIA_CERTIFICATION_EVENT } from './inertiaCertification';",
              1,
          )
          old_ready = """function finalWorkOrderReady() {\n  const target = readPhysicsTarget();\n  if (!target?.result.placements.length) return false;\n  const signature = createPhysicsTargetSignature(target);\n  const finalPhysics = readFinalPhysicsValidation();\n  if (!finalPhysics || finalPhysics.signature !== signature) return false;\n  const certification = readLatestInertiaCertification();\n  return Boolean(\n    certification\n    && certification.targetSignature === signature\n    && canCreateWorkOrder(certification),\n  );\n}\n"""
          new_ready = """function finalWorkOrderReady() {\n  const target = readPhysicsTarget();\n  return Boolean(target?.result.placements.length);\n}\n"""
          if old_ready not in text:
              raise SystemExit('HeaderActionBridge finalWorkOrderReady anchor not found')
          p.write_text(text.replace(old_ready, new_ready, 1))
          PY
      - run: npm run typecheck
      - run: npm run build
      - name: Commit verified patches
        shell: bash
        run: |
          rm .github/workflows/runtime-consistency-patch.yml
          git config user.name "purplecrown7304-maker"
          git config user.email "purplecrown7304@gmail.com"
          git add src/App.tsx src/ExcelExportActions.tsx src/HeaderActionBridge.tsx src/engine/palletAdaptiveSearch.ts .github/workflows/runtime-consistency-patch.yml
          git commit -m "런타임 타입 오류 및 작업지시서 차단 규칙 정리"
          git push origin HEAD:fix/runtime-consistency-20260908
