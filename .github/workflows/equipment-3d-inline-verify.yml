name: Equipment 3D Inline Verify

on:
  push:
    branches: [fix/equipment-3d-inline-20260908-v2]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Upgrade npm
        run: npm install -g npm@11
      - name: Install dependencies
        run: npm install
      - name: Production build
        run: npm run build
