name: Stack Height Hotfix Verify

on:
  push:
    branches: [fix/direct-box-stack-height-20260908]

jobs:
  verify-stack-height:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Upgrade npm
        run: npm install -g npm@11
      - name: Install dependencies
        run: npm install
      - name: Stack-height regressions
        run: npx vitest run src/engine/fallPreventionRegression.test.ts src/engine/directBoxConfiguredStackHeightRegression.test.ts src/engine/directBoxMixedStackLimitsRegression.test.ts
      - name: Production build
        run: npm run build
