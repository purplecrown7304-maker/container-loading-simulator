name: Header Actions Refactor

on:
  push:
    branches: [refactor/header-actions-no-dom-bridge-20260908]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/header-actions-no-dom-bridge-20260908
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install -g npm@11
      - run: npm install
      - name: Refactor header actions into App
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text()
          import_anchor = "import WorkspaceTools from './WorkspaceTools';\n"
          if import_anchor not in text:
              raise SystemExit('App import anchor not found')
          text = text.replace(import_anchor, import_anchor + "import { APP_ACTION_EVENT, type AppActionDetail } from './uiEvents';\n", 1)

          reset_anchor = """  const resetAll = () => {\n    if (!window.confirm('등록된 화물과 저장 데이터를 모두 초기화할까요?')) return;\n    setContainer(defaultContainer);\n    setCargo([]);\n    setResult(loadContainer(defaultContainer, []));\n    localStorage.removeItem(STORAGE_KEY);\n    invalidatePhysics();\n    announce('success', '모든 화물 데이터를 초기화했습니다. 샘플 복원으로 언제든 예시 데이터를 만들 수 있습니다.');\n    resetDraft();\n  };\n\n"""
          if reset_anchor not in text:
              raise SystemExit('App resetAll anchor not found')
          action_effect = reset_anchor + """  useEffect(() => {\n    const onAppAction = (event: Event) => {\n      const action = (event as CustomEvent<AppActionDetail>).detail?.action;\n      if (!action) return;\n      if (action === 'run-loading') { void runLoading(); return; }\n      if (action === 'show-results') { showResults(); return; }\n      if (action === 'load-local') { loadLocal(); return; }\n      if (action === 'save-local') { saveLocal(); return; }\n      if (action === 'print-report') { printReport(); return; }\n      if (action === 'reset-all') { resetAll(); return; }\n      if (action === 'viewer') { scrollToViewer(); return; }\n      if (action === 'dashboard') scrollToDashboard();\n    };\n    window.addEventListener(APP_ACTION_EVENT, onAppAction);\n    return () => window.removeEventListener(APP_ACTION_EVENT, onAppAction);\n  }, [container, cargo, result, mode, isRunning, navSection]);\n\n"""
          text = text.replace(reset_anchor, action_effect, 1)

          right_anchor = """      <aside className=\"dashboard-right\">\n        <section className=\"dashboard-card summary-card\"><h2>4. 적재 요약</h2>"""
          if right_anchor not in text:
              raise SystemExit('App dashboard-right anchor not found')
          action_panel = """      <aside className=\"dashboard-right\">\n        <section className=\"dashboard-card viewer-final-action-row\" aria-label=\"주요 작업\">\n          <h2>주요 작업</h2>\n          <button type=\"button\" className=\"viewer-final-action primary\" disabled={isRunning} onClick={() => void runLoading()}>\n            {isRunning ? '검사 진행 중…' : '최종 적재 진행'}\n          </button>\n          <button type=\"button\" className=\"viewer-final-action report\" disabled={isRunning} onClick={printReport}>작업지시서 보기</button>\n          <button type=\"button\" className=\"viewer-final-action reset\" disabled={isRunning} onClick={resetAll}>전체 초기화</button>\n        </section>\n\n        <section className=\"dashboard-card summary-card\"><h2>4. 적재 요약</h2>"""
          text = text.replace(right_anchor, action_panel, 1)
          app.write_text(text)

          main = Path('src/main.tsx')
          text = main.read_text()
          text = text.replace("import HeaderActionBridge from './HeaderActionBridge';\n", '', 1)
          text = text.replace("      <HeaderActionBridge />\n", '', 1)
          main.write_text(text)
          PY
      - run: rm src/HeaderActionBridge.tsx
      - run: npm run typecheck
      - run: npm run check:architecture
      - run: npm run build
      - name: Commit verified refactor
        shell: bash
        run: |
          rm .github/workflows/header-actions-refactor.yml
          git config user.name "purplecrown7304-maker"
          git config user.email "purplecrown7304@gmail.com"
          git add src/App.tsx src/main.tsx src/HeaderActionBridge.tsx .github/workflows/header-actions-refactor.yml
          git commit -m "헤더 주요 작업 DOM 브리지 제거"
          git push origin HEAD:refactor/header-actions-no-dom-bridge-20260908
