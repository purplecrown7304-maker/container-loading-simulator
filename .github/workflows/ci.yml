name: CI

# September 2026 release-candidate validation.
# Pull requests into main must pass the same checks required immediately before deployment.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      # This repository intentionally has no package-lock.json yet. Exact direct
      # dependency versions are pinned in package.json. legacy-peer-deps avoids an
      # npm 10 Arborist peer-graph crash observed on the hosted runner.
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-fund --no-audit

      - name: Record dependency versions
        run: npm ls --depth=0 --legacy-peer-deps

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Predeploy verification
        run: npm run verify:predeploy

      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        # Stop a failing run early enough to retain its diagnostics. A successful
        # run still executes the complete desktop/mobile suite without skips.
        timeout-minutes: 28
        run: npm run test:e2e -- --max-failures=3

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-diagnostics-${{ github.run_attempt }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload browser failure context
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-failure-context-${{ github.run_attempt }}
          path: |
            test-results/**/error-context.md
            test-results/.last-run.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload production build
        uses: actions/upload-artifact@v6
        with:
          name: container-loading-simulator-v2.6.0-dist
          path: dist
          if-no-files-found: error
          retention-days: 14
