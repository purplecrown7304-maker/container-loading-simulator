name: CI

# September 2026 release-candidate validation.
# Pull requests into main must pass the same checks required immediately before deployment.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      # This repository intentionally has no package-lock.json yet. Exact direct
      # dependency versions are pinned in package.json, so CI installs from that
      # manifest and records the resolved tree before running release gates.
      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Record dependency versions
        run: npm ls --depth=0

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Predeploy verification
        run: npm run verify:predeploy

      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run test:e2e

      - name: Upload production build
        uses: actions/upload-artifact@v6
        with:
          name: container-loading-simulator-v2.6.0-dist
          path: dist
          if-no-files-found: error
          retention-days: 14
