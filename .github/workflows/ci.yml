name: CI

on:
  push:
    branches:
      - ux-v3-workflow-no-deploy
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Record dependency versions
        run: npm ls --depth=0 --legacy-peer-deps

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Predeploy verification
        run: npm run verify:predeploy

      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run test:e2e

      - name: Upload build artifact for verification only
        uses: actions/upload-artifact@v6
        with:
          name: container-loading-simulator-ux-v3-verification-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
