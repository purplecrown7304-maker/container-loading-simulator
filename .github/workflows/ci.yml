name: CI

# August Actions usage was paused. September development resumes PR verification.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Record dependency versions
        run: npm ls --depth=0

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Predeploy verification
        run: npm run verify:predeploy

      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run test:e2e

      - name: Upload production build
        uses: actions/upload-artifact@v6
        with:
          name: container-loading-simulator-v2.6.0-dist
          path: dist
          if-no-files-found: error
          retention-days: 14
